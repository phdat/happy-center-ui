<section id="contact" class="container contact" aria-labelledby="contact-title">
  <div class="info">
    <div class="intro">
      <h2 id="contact-title" class="section-title">Để lại thông tin, Happy sẽ gọi lại cho bạn</h2>
      <p class="section-lead">Hoặc ghé trực tiếp trung tâm — luôn có người sẵn sàng tư vấn.</p>
    </div>

    <ul class="facts">
      <li>
        <span class="icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" /><circle cx="12" cy="9.5" r="2.5" />
          </svg>
        </span>
        <span class="fact"><strong>Địa chỉ</strong><span>{{ info.address }}</span></span>
      </li>
      <li>
        <span class="icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" />
          </svg>
        </span>
        <span class="fact">
          <strong>Hotline / Zalo</strong>
          @if (info.hotlineTel) {
            <a [href]="'tel:' + info.hotlineTel">{{ info.hotline }}</a>
          } @else {
            <span>{{ info.hotline }}</span>
          }
        </span>
      </li>
      <li>
        <span class="icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
          </svg>
        </span>
        <span class="fact"><strong>Giờ làm việc</strong><span>{{ info.hours }}</span></span>
      </li>
    </ul>

    <div class="map">
      <iframe
        title="Bản đồ đường đến Trung tâm Happy"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1209.3571342554415!2d106.04243686658194!3d9.999252682587704!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31a06e60ac7097ad%3A0x4cd7cb4c1f7169e2!2zVGjhu5tpIEhvw6AgTWlkZGxlIFNjaG9vbA!5e0!3m2!1sen!2s!4v1790873445782!5m2!1sen!2s"
        allowfullscreen
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </div>

  <div class="form-card">
    <app-contact-form />
  </div>
</section>
