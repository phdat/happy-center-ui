@let c = course();
<article class="card" [attr.aria-labelledby]="'course-' + c.id">
  <span class="tag">{{ c.tag }}</span>
  <h3 class="title" [id]="'course-' + c.id">{{ c.title }}</h3>
  <p class="desc">{{ c.description }}</p>

  <ul class="highlights">
    @for (h of c.highlights; track h) {
      <li>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12l5 5 9-10" />
        </svg>
        {{ h }}
      </li>
    }
  </ul>

  @if (c.meta.length) {
    <dl class="meta">
      @for (m of c.meta; track m.label) {
        <div>
          <dt>{{ m.label }}:</dt>
          <dd>{{ m.value }}</dd>
        </div>
      }
    </dl>
  }

  <a href="#contact" class="btn btn-dark consult" (click)="consult.emit(c.id)">
    Tư vấn khóa này<span class="sr-only">: {{ c.title }}</span>
  </a>
</article>
